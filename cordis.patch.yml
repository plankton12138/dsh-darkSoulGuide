- insert:
    - id: darksouls-guide
      name: dsh-darksouls-guide
      config:
        tools: false
        prompt: false
        panel: true

# The 「黑魂3 攻略」agent preset. Its guide row mounts this same package with
# tools+prompt on and panel off, so the model-facing half exists only inside
# sessions that chose the preset.
- insert:
    - id: preset-ds3-guide
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ds3-guide
        name: 黑魂3 攻略
        description: 读存档回答黑暗之魂3 攻略与路线问题，附收集进度。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: guide
            name: dsh-darksouls-guide
            config:
              tools: true
              prompt: true
              panel: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
